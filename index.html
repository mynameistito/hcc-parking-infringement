<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore Hamilton parking infringements, ticket totals, daily trends and street breakdowns using Hamilton City Council open data."
    />
    <title>Hamilton Parking Infringements &amp; Ticket Trends</title>
    <script>
      try {
        if (localStorage.getItem("hcc-theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch {}
    </script>
    <style>
      html {
        background-color: #000000;
        color-scheme: dark;
      }
      html.light {
        background-color: #ffffff;
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100%;
        background-color: inherit;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>Hamilton parking infringements</h1>
        <p>
          Explore parking ticket totals, daily trends and street breakdowns for
          Hamilton, New Zealand, using Hamilton City Council open data.
        </p>
        <p>
          Source:
          <a
            href="https://data-waikatolass.opendata.arcgis.com/datasets/hcc::infringement/about"
            >Hamilton City Council infringement dataset</a
          >, licensed under CC BY 4.0.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
